<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature courriel</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 24px 16px; background: #f4f4f4; color: #111; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  .box { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row label { flex: 1 1 200px; }
  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
  input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  #preview { overflow-x: auto; padding: 8px 0; }
  button { background: #ED3B43; color: #fff; border: 0; border-radius: 4px; padding: 10px 16px; font-size: 14px; font-weight: bold; cursor: pointer; }
  #msg { margin-left: 10px; font-size: 13px; color: #2a7a2a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Signature courriel</h1>

  <div class="box">
    <div class="row">
      <label>Prénom <input id="firstName"></label>
      <label>Nom <input id="lastName"></label>
    </div>
    <label>Titre (FR) <input id="titleFr"></label>
    <label>Titre (EN) <input id="titleEn"></label>
    <div class="row">
      <label>Téléphone <input id="phone" placeholder="514 000-0000"></label>
      <label>Téléphone 2 <input id="phone2" placeholder="514 000-0000 x0000"></label>
    </div>
    <label>URL LinkedIn (optionnel) <input id="linkedin" placeholder="https://www.linkedin.com/in/..."></label>
  </div>

  <div class="box">
    <div id="preview"></div>
    <p><button id="copyBtn">Copier la signature</button><span id="msg"></span></p>
    <p style="font-size:13px;color:#555">Ensuite, dans Outlook : Paramètres → Comptes → Signatures → nouvelle signature → Ctrl+V.</p>
  </div>
</div>

<script>
// Same signature template as https://gebdl.p3f.dev/signature-courriel/
var IMG = "https://gebdl.p3f.dev/email-signature/images/";
var C = {
  logo: IMG + "email-signature-logo.png", siteUrl: "https://gebdl.p3f.dev/",
  linkedin: "https://www.linkedin.com/company/groupe-%C3%A9nergie-bdl-inc./",
  websiteUrl: "https://gebdl.com", websiteLabel: "gebdl.com",
  iconPhone: IMG + "icon-phone.png", iconCell: IMG + "icon-cellphone.png",
  iconMouse: IMG + "icon-mouse.png", iconLinkedin: IMG + "icon-linkedin.png"
};
var FIELDS = ["firstName", "lastName", "titleFr", "titleEn", "phone", "phone2", "linkedin"];
var TBL = '<table style="border-collapse:collapse;border-spacing:0;" cellpadding="0" cellspacing="0">';

function esc(t) { return (t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function spacer(h) { return TBL + '<tr><td height="' + h + '" style="padding:0;line-height:' + h + 'px;font-size:0;">&nbsp;</td></tr></table>'; }
function url(t) { return t ? (/^https?:\/\//i.test(t) ? t : "https://" + t) : ""; }
function tel(t) { var d = (t || "").replace(/[xX].*$/, "").replace(/[^\d+]/g, ""); return d ? "tel:" + d : "#"; }
function img(src, w, h) { return '<img src="' + esc(src) + '" width="' + w + '" height="' + h + '" alt="" style="display:block;border:0;width:' + w + 'px;height:' + h + 'px;">'; }
function item(icon, href, text) {
  return TBL + '<tr><td width="20" align="center" style="padding:0;vertical-align:middle;text-align:center;">' + icon +
    '</td><td width="8" style="padding:0;"></td><td style="padding:0;vertical-align:middle;"><a href="' + esc(href) +
    '" target="_blank" style="font-size:13px;line-height:1.35;font-family:Arial,Calibri,sans-serif;color:#000000;text-decoration:none;">' +
    esc(text) + "</a></td></tr></table>";
}
function cell(content, w) { w = w || 200; return '<td width="' + w + '" style="width:' + w + 'px;padding:0 16px 0 0;vertical-align:top;">' + content + "</td>"; }
function row(cells) { var c = cells.filter(Boolean).join(""); return c ? TBL + "<tr>" + c + "</tr></table>" : ""; }
function title(t, color) {
  return t ? '<div style="font-size:13px;line-height:1.35;font-weight:bold;font-family:Arial,Calibri,sans-serif;color:' + color + ';">' + esc(t) + "</div>" : "";
}

function buildSignature(v) {
  var name = [v.firstName, v.lastName].filter(Boolean).join(" ");
  var fr = title(v.titleFr, "#ED3B43"), en = title(v.titleEn, "#000000");
  var tel1 = v.phone ? cell(item(img(C.iconCell, 9, 13), tel(v.phone), v.phone), 160) : "";
  var tel2 = v.phone2 ? cell(item(img(C.iconPhone, 14, 14), tel(v.phone2), v.phone2)) : "";
  var web = cell(item(img(C.iconMouse, 10, 13), C.websiteUrl, C.websiteLabel), 160);
  var li = cell(item(img(C.iconLinkedin, 14, 14), url(v.linkedin || C.linkedin), "Linkedin"));
  return '<table style="border-collapse:collapse;border-spacing:0; border-bottom:1px solid #C4C4C4;" cellpadding="0" cellspacing="0"><tr>' +
    '<td width="280" valign="middle" style="width:280px;padding:0 24px 0 0;vertical-align:middle;">' +
    '<a href="' + esc(C.siteUrl) + '" target="_blank"><img src="' + esc(C.logo) + '" alt="Groupe Energie BDL" width="256" height="69" style="display:block;border:0;width:256px;height:auto;"></a>' +
    '</td><td valign="middle" style="padding:10px 0 10px 24px;vertical-align:middle;border-left:1px solid #C4C4C4;">' +
    "<div style=\"font-size:20px;line-height:1.2;font-weight:900;font-family:'Arial Black',Arial,Calibri,sans-serif;color:#000000;text-transform:uppercase;letter-spacing:0.02em;\">" +
    (esc(name) || "&nbsp;") + "</div>" +
    (fr || en ? spacer(6) : "") + fr + en + spacer(16) + row([tel1, tel2]) + row([web, li]) +
    "</td></tr></table>";
}

function values() {
  var v = {};
  FIELDS.forEach(function (f) { v[f] = document.getElementById(f).value.trim(); });
  return v;
}
function refresh() { document.getElementById("preview").innerHTML = buildSignature(values()); }
function say(t) { var m = document.getElementById("msg"); m.textContent = t; setTimeout(function () { m.textContent = ""; }, 3000); }

// Pre-fill from the link sent by the bot: ?firstName=...&lastName=...
var params = new URLSearchParams(location.search);
FIELDS.forEach(function (f) {
  var el = document.getElementById(f);
  if (params.has(f)) el.value = params.get(f);
  el.addEventListener("input", refresh);
});
refresh();

document.getElementById("copyBtn").addEventListener("click", function () {
  var html = buildSignature(values());
  var preview = document.getElementById("preview");
  if (navigator.clipboard && window.ClipboardItem) {
    navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([preview.innerText], { type: "text/plain" })
    })]).then(function () { say("Copié ✅ — collez-la dans Outlook"); }, selectPreview);
  } else {
    selectPreview();
  }
});
function selectPreview() {
  var r = document.createRange();
  r.selectNodeContents(document.getElementById("preview"));
  var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  say("Faites Ctrl+C pour copier la sélection");
}
</script>
</body>
</html>
